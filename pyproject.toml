[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MasPRT"
version = "0.2.0.dev0"
authors = [
  { name="Chavis Manzoni Team, Inmed, INSERM" },
]
description = "Machine automated scoring for pup retrieval test"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
'deeplabcut[tf]==3.0.2',
'pandas>=2.2,<3',
'numpy>=1.26,<2',
'matplotlib>=3.8',
'opencv-python-headless>=4.10,<4.12',
'Pillow>=10.4',
'pycocotools>=2.0.7',
'Shapely>=2.0.5,<3',
'xlsxwriter',
'PyYAML>=6',
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]


[project.urls]
Homepage = "https://github.com/ChavisManzoniLab/MAS-PRT"
Issues = "https://github.com/ChavisManzoniLab/MAS-PRT"


[project.gui-scripts]
MAS = "MAS.gui:GUI"
mas = "MAS.gui:GUI"

[tool.setuptools.packages.find]
include = ["MAS", "MAS.*"]

[tool.setuptools.package-data]
MAS = ["DLC/**/*.yaml"]
